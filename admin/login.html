<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Iraiva Ministries</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/webp" href="../assets/images/iraiva-logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="login.css">
</head>
<body class="admin-body login-body">

<div class="login-page">
  <div class="login-card">

    <div class="login-brand">
      <img src="../assets/images/iraiva-logo.webp" alt="Iraiva Ministries logo">
      <div class="login-brand-text">
        <strong>IRAIVA MINISTRIES</strong>
        <small>ADMIN ACCESS</small>
      </div>
    </div>

    <h1 class="login-title">Welcome back</h1>
    <p class="login-subtitle">Sign in to manage the Lyrics Library.</p>

    <form id="loginForm" class="login-form" novalidate>
      <div class="field-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" name="email" placeholder="admin@iraivaministries.org" autocomplete="username" required>
      </div>

      <div class="field-group">
        <label for="loginPassword">Password</label>
        <div class="password-wrap">
          <input type="password" id="loginPassword" name="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" id="togglePassword" class="toggle-password" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0112 20c-7 0-11-7-11-7a20.4 20.4 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 7 11 7a20.32 20.32 0 01-3.11 4.24M14.12 14.12a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/></svg>
          </button>
        </div>
      </div>

      <div id="loginError" class="login-error" role="alert"></div>

      <button type="submit" class="login-submit">Login</button>
    </form>

    <p class="login-footnote">Development build — client-side demo authentication only.</p>
  </div>
</div>

<script src="login.js"></script>
</body>
</html>
